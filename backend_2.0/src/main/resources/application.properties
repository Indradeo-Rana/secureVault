spring.application.name=${APP_NAME:SecureVault}
server.port=${SERVER_PORT:8080}

# datasource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Encryption configuration
encryption.secret=${ENCRYPTION_SECRET}

# Password recovery
#password.recovery.delivery=console ( changed to email )
password.recovery.delivery=email

# ==============================
# Google OAuth2
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

app.frontend.url=${APP_FRONTEND_URL}

# Redis cache (optional; app falls back to database when unavailable)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

# Security analytics cache TTL (seconds)
securevault.cache.security-analytics-ttl-seconds=120

# Notification delivery. Leave disabled for console-only development.
notification.email.enabled=true
notification.email.from=${MAIL_USERNAME}
notification.push.enabled=true
notification.push.credentials=${FIREBASE_CREDENTIALS}

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

#==========================
# PASSWORD EXPIRATION
#==========================

security.password.expiration-days=${PASSWORD_EXPIRATION_DAYS:90}
security.password.warning-days=${PASSWORD_WARNING_DAYS:7}

#check every 24 hours
security.password.expiration-check-ms=${PASSWORD_EXPIRATION_CHECK_MS:86400000}
